[package]
name = "gamelib-core"
description = "GameLib core: Steam catalog client, local SQLite storage, sync and external links"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bzip2 = "0.6"
dirs.workspace = true
flate2 = "1.1"
fs4 = "1.1"
lzma-rust2 = { version = "0.16", default-features = false, features = ["std", "xz"] }
md-5 = "0.10"
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# 0.20: later releases need a newer Rust than the workspace's minimum.
sevenz-rust2 = { version = "0.20", default-features = false, features = ["bzip2", "deflate", "ppmd"] }
tar = { version = "0.4.46", default-features = false }
thiserror.workspace = true
toml = { version = "0.8", default-features = false, features = ["parse"] }
zip = { version = "8.6", default-features = false, features = ["bzip2", "deflate-flate2-zlib-rs", "deflate64", "lzma", "xz"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "0.6"

