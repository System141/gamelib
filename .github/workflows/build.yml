# Checks every push. Installers are built on demand (Actions → Build → Run workflow), for pushes
# whose last commit message contains "[installer]" (Windows only), and for version tags (v*),
# which also publish them as a GitHub release.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Kurulum paketi üretilecek sistemler
        type: choice
        options: [windows, all, macos, linux]
        default: windows

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # The toolchain the code is checked with locally; bump deliberately.
  RUST_TOOLCHAIN: "1.94.1"

jobs:
  check:
    name: Check
    # A manual run only builds installers.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Install WebKitGTK (for the Tauri shell)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  check-windows:
    name: Check (Windows)
    # The Windows-only code (credential encryption, installers, the downloaded-file mark, GOG's
    # registry entries) only compiles and runs here.
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p gamelib-core -p gamelib-cli --all-targets --locked -- -D warnings
      - run: cargo test -p gamelib-core -p gamelib-cli --locked

  plan:
    name: Plan installers
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[installer]')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms || (startsWith(github.ref, 'refs/tags/v') && 'all') || 'windows' }}
        run: |
          all='[
            {"platform": "windows", "os": "windows-latest", "args": "--bundles nsis"},
            {"platform": "macos", "os": "macos-latest", "args": "--target universal-apple-darwin"},
            {"platform": "linux", "os": "ubuntu-22.04", "args": "--bundles appimage,deb,rpm"}
          ]'
          echo "matrix=$(jq -c --arg p "$PLATFORMS" '{include: [.[] | select($p == "all" or .platform == $p)]}' <<<"$all")" >> "$GITHUB_OUTPUT"

  bundle:
    name: Installer (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install WebKitGTK
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf libfuse2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the app
        run: pnpm tauri build ${{ matrix.args }}
      - name: Build gamelib-cli
        run: cargo build --release --locked -p gamelib-cli
      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          case "${{ matrix.platform }}" in
            windows)
              cp target/release/bundle/nsis/*-setup.exe out/
              cp target/release/gamelib-cli.exe out/gamelib-cli-windows-x64.exe ;;
            macos)
              cp target/universal-apple-darwin/release/bundle/dmg/*.dmg out/
              cp target/release/gamelib-cli out/gamelib-cli-macos-arm64 ;;
            linux)
              cp target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm out/
              cp target/release/gamelib-cli out/gamelib-cli-linux-x64 ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: gamelib-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
