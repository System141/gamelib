[workspace]
resolver = "3"
members = ["crates/gamelib-core", "crates/gamelib-cli", "src-tauri"]
# `cargo test` / `cargo run` at the root skip the Tauri shell, so they work without
# the GTK/WebKit system libraries it needs on Linux.
default-members = ["crates/gamelib-core", "crates/gamelib-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
gamelib-core = { path = "crates/gamelib-core" }
# Same version as Tauri uses, so default paths match the desktop app's.
dirs = "7"
reqwest = { version = "0.13.5", features = ["blocking", "json", "gzip", "query"] }
# Apache-2.0 torrent engine (see THIRD_PARTY_NOTICES.md); only `downloads/torrent.rs` uses it.
librqbit = "9.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# SQLite's C code and JSON parsing are hot paths during a sync; keep them fast
# even in debug builds so `tauri dev` stays usable.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3
